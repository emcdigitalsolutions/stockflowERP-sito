name: Deploy to GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # Il sito è ora solo un insieme di reindirizzamenti verso sartonero.it:
      # si pubblicano SOLO le pagine pubbliche (niente admin.html, server.py, docs, PDF).
      - name: Prepara solo i file pubblici
        run: |
          mkdir _site
          cp index.html manuale.html training.html changelog.html privacy-policy.html cookie-policy.html terms-of-service.html favicon.ico favicon.svg robots.txt _site/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
